<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>地震緊急避難 - 安全回報系統 (離線版)</title>
    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --danger-color: #e74c3c;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #333;
        }
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 1rem 1.2rem 1rem;
            text-align: center;
            position: relative;
        }
        header h2 {
            margin: 0 0 8px 0;
            padding-right: 90px; /* 留出空間給右上角按鈕，避免重疊 */
            text-align: left;
            font-size: 1.3rem;
        }
        .admin-btn {
            position: absolute;
            top: 12px;
            right: 12px;
            background-color: #34495e;
            color: white;
            border: 1px solid #7f8c8d;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.3s;
            z-index: 10;
        }
        .admin-btn:hover {
            background-color: #4e6d8c;
        }
        .header-status-container {
            text-align: left;
        }
        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .view-page {
            display: none;
        }
        .view-page.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button.btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1.1rem;
            border-radius: 4px;
            cursor: pointer;
        }
        button.btn-danger {
            background-color: var(--danger-color);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: white;
        }
        .offline-status {
            background-color: #f39c12;
        }

        /* 表格容器與載具響應式設計 */
        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        /* 表格標題：禁止自動換行與預設大小（電腦端） */
        th {
            background-color: #ecf0f1;
            white-space: nowrap;
            font-size: 1rem;
        }

        /* 平板裝置（螢幕寬度 768px 以下） */
        @media (max-width: 768px) {
            th {
                font-size: 0.9rem;
                padding: 6px 4px;
            }
        }

        /* 手機裝置（螢幕寬度 480px 以下） */
        @media (max-width: 480px) {
            th {
                font-size: 0.8rem;
                padding: 6px 2px;
            }
        }

        .summary-card {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #eef2f5;
            padding: 15px;
            border-radius: 6px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-item span {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .back-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .unreported-row {
            color: #95a5a6;
            background-color: #fafafa;
        }
    </style>
</head>
<body>

<header>
    <h2>地震緊急避難安全回報系統</h2>
    <button class="admin-btn" id="adminHeaderBtn" onclick="requestAdminAccess()">進入後台</button>
    <div class="header-status-container">
        <div class="status-badge offline-status" id="connectionStatus">離線模式運作中</div>
    </div>
</header>

<!-- 使用者端（副班長回報頁面） -->
<div id="userPage" class="container view-page active">
    <h3>各班狀況回報表單</h3>
    <form id="reportForm">
        <div class="form-group">
            <label for="className">班級名稱</label>
            <select id="className" required>
                <option value="" disabled selected>請選擇班級</option>
                <!-- 七年級 -->
                <option value="七年忠班">七年忠班</option>
                <option value="七年孝班">七年孝班</option>
                <option value="七年仁班">七年仁班</option>
                <option value="七年愛班">七年愛班</option>
                <option value="七年信班">七年信班</option>
                <option value="七年義班">七年義班</option>
                <!-- 八年級 -->
                <option value="八年忠班">八年忠班</option>
                <option value="八年孝班">八年孝班</option>
                <option value="八年仁班">八年仁班</option>
                <option value="八年愛班">八年愛班</option>
                <option value="八年信班">八年信班</option>
                <option value="八年義班">八年義班</option>
                <!-- 九年級 -->
                <option value="九年忠班">九年忠班</option>
                <option value="九年孝班">九年孝班</option>
                <option value="九年仁班">九年仁班</option>
                <option value="九年愛班">九年愛班</option>
                <option value="九年信班">九年信班</option>
                <option value="九年義班">九年義班</option>
                <!-- 十年級 -->
                <option value="十年誠班">十年誠班</option>
                <option value="十年愛班">十年愛班</option>
                <option value="十年熱班">十年熱班</option>
                <option value="十年智班">十年智班</option>
                <!-- 十一年級 -->
                <option value="十一年誠班">十一年誠班</option>
                <option value="十一年愛班">十一年愛班</option>
                <option value="十一年熱班">十一年熱班</option>
                <option value="十一年智班">十一年智班</option>
                <!-- 十二年級 -->
                <option value="十二年誠班">十二年誠班</option>
                <option value="十二年愛班">十二年愛班</option>
                <option value="十二年熱班">十二年熱班</option>
                <option value="十二年智班">十二年智班</option>
            </select>
        </div>
        <div class="form-group">
            <label for="reporterName">回報人（副班長）</label>
            <input type="text" id="reporterName" placeholder="請輸入姓名" required>
        </div>
        <div class="form-group">
            <label for="safeCount">平安人數</label>
            <input type="number" id="safeCount" min="0" value="0" required>
        </div>
        <div class="form-group">
            <label for="injuredCount">受傷人數</label>
            <input type="number" id="injuredCount" min="0" value="0" required>
        </div>
        <div class="form-group">
            <label for="missingCount">未到/失聯人數</label>
            <input type="number" id="missingCount" min="0" value="0" required>
        </div>
        <div class="form-group">
            <label for="note">特殊情況說明（例如：受傷細節、地點）</label>
            <textarea id="note" rows="3" placeholder="若無特殊狀況可留空"></textarea>
        </div>
        <button type="submit" class="btn-submit">提交回報（儲存於本地）</button>
    </form>
</div>

<!-- 後台端（總指揮總覽頁面） -->
<div id="adminPage" class="container view-page">
    <button class="back-btn" onclick="showUserPage()">← 返回副班長回報端</button>
    <h3>後台總覽與統計</h3>
    
    <div class="summary-card">
        <div class="summary-item">
            平安總數
            <span id="totalSafe" style="color: var(--accent-color);">0</span>
        </div>
        <div class="summary-item">
            受傷總數
            <span id="totalInjured" style="color: var(--danger-color);">0</span>
        </div>
        <div class="summary-item">
            失聯總數
            <span id="totalMissing" style="color: #f39c12;">0</span>
        </div>
    </div>

    <button onclick="exportData()" class="btn-submit" style="margin-bottom: 10px; background-color: #3498db;">匯出 JSON 備份檔</button>
    <button onclick="clearData()" class="btn-submit btn-danger">清空所有儲存資料</button>

    <h4>全校各班回報狀態明細</h4>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>班級</th>
                    <th>回報人</th>
                    <th>平安</th>
                    <th>受傷</th>
                    <th>失聯</th>
                    <th>時間</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <!-- 動態加入資料 -->
            </tbody>
        </table>
    </div>
</div>

<script>
    // 全校完整班級清單清單
    const allGradeClasses = [
        // 七年級
        "七年忠班", "七年孝班", "七年仁班", "七年愛班", "七年信班", "七年義班",
        // 八年級
        "八年忠班", "八年孝班", "八年仁班", "八年愛班", "八年信班", "八年義班",
        // 九年級
        "九年忠班", "九年孝班", "九年仁班", "九年愛班", "九年信班", "九年義班",
        // 十年級
        "十年誠班", "十年愛班", "十年熱班", "十年智班",
        // 十一年級
        "十一年誠班", "十一年愛班", "十一年熱班", "十一年智班",
        // 十二年級
        "十二年誠班", "十二年愛班", "十二年熱班", "十二年智班"
    ];

    // 檢查 URL 參數或按鈕進入後台
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'admin') {
            requestAdminAccess();
        }
    });

    // 請求進入後台（密碼驗證）
    function requestAdminAccess() {
        const password = prompt("請輸入後台管理密碼：");
        if (password === "3118") {
            showAdminPage();
        } else if (password !== null) {
            alert("密碼錯誤，無法進入後台！");
            showUserPage();
        }
    }

    // 顯示後台頁面
    function showAdminPage() {
        document.getElementById('userPage').classList.remove('active');
        document.getElementById('adminPage').classList.add('active');
        document.getElementById('adminHeaderBtn').style.display = 'none';
        renderAdminDashboard();
    }

    // 顯示使用者頁面
    function showUserPage() {
        document.getElementById('adminPage').classList.remove('active');
        document.getElementById('userPage').classList.add('active');
        document.getElementById('adminHeaderBtn').style.display = 'block';
        
        // 清除網址上的 mode=admin 參數，保持 URL 整潔
        if (window.location.search.includes('mode=admin')) {
            const newUrl = window.location.pathname;
            window.history.replaceState({}, document.title, newUrl);
        }
    }

    // 取得與儲存本地資料
    function getReports() {
        const reports = localStorage.getItem('disaster_reports');
        return reports ? JSON.parse(reports) : [];
    }

    function saveReport(data) {
        const reports = getReports();
        
        // 如果同個班級重複回報，直接更新最新數據
        const existingIndex = reports.findIndex(r => r.className === data.className);
        if (existingIndex !== -1) {
            reports[existingIndex] = data;
        } else {
            reports.push(data);
        }
        
        localStorage.setItem('disaster_reports', JSON.stringify(reports));
    }

    // 表單提交處理
    document.getElementById('reportForm').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const reportData = {
            id: Date.now(),
            className: document.getElementById('className').value,
            reporterName: document.getElementById('reporterName').value,
            safeCount: parseInt(document.getElementById('safeCount').value) || 0,
            injuredCount: parseInt(document.getElementById('injuredCount').value) || 0,
            missingCount: parseInt(document.getElementById('missingCount').value) || 0,
            note: document.getElementById('note').value,
            timestamp: new Date().toLocaleTimeString()
        };

        saveReport(reportData);
        alert('回報已順利儲存於本機系統！');
        this.reset();
    });

    // 渲染後台資料（列出全校所有班級）
    function renderAdminDashboard() {
        const reports = getReports();
        const tbody = document.getElementById('reportTableBody');
        tbody.innerHTML = '';

        // 轉換為字典方便迅速查尋
        const reportMap = {};
        reports.forEach(r => {
            reportMap[r.className] = r;
        });

        let totalSafe = 0;
        let totalInjured = 0;
        let totalMissing = 0;

        // 逐一遍歷全校所有班級
        allGradeClasses.forEach(className => {
            const tr = document.createElement('tr');
            
            if (reportMap[className]) {
                const report = reportMap[className];
                totalSafe += report.safeCount;
                totalInjured += report.injuredCount;
                totalMissing += report.missingCount;

                tr.innerHTML = `
                    <td><strong>${escapeHtml(report.className)}</strong></td>
                    <td>${escapeHtml(report.reporterName)}</td>
                    <td>${report.safeCount}</td>
                    <td>${report.injuredCount}</td>
                    <td>${report.missingCount}</td>
                    <td>${report.timestamp}</td>
                `;
            } else {
                // 尚未回報的班級
                tr.classList.add('unreported-row');
                tr.innerHTML = `
                    <td>${className}</td>
                    <td colspan="5"><em>未回報</em></td>
                `;
            }
            tbody.appendChild(tr);
        });

        document.getElementById('totalSafe').innerText = totalSafe;
        document.getElementById('totalInjured').innerText = totalInjured;
        document.getElementById('totalMissing').innerText = totalMissing;
    }

    // 防 HTML 注入
    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }

    // 資料匯出機制
    function exportData() {
        const reports = getReports();
        const dataStr = "data:text/json;charset=utf-8," + encodeURIComponent(JSON.stringify(reports, null, 2));
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", `避難安全回報備份_${new Date().toISOString().slice(0,10)}.json`);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
    }

    // 清除資料
    function clearData() {
        if (confirm("確定要清除所有已回報的歷史資料嗎？")) {
            localStorage.removeItem('disaster_reports');
            renderAdminDashboard();
        }
    }
</script>

</body>
</html>
