<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- 網頁名稱設定 -->
    <title>靜心高中災害避難狀況回報系統</title>

    <!-- 主畫面圖示 (iOS Safari 專用) -->
    <link rel="apple-touch-icon" href="icon_earthquake.png">
    <link rel="apple-touch-icon-precomposed" href="icon_earthquake.png">
    <link rel="apple-touch-icon" href="https://tahai-hsieh.github.io/Status-Report/icon_earthquake.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon_earthquake.png">

    <!-- 網頁分頁圖案（Favicon 圓形設定） -->
    <link rel="icon" type="image/png" id="dynamicFavicon" href="icon_earthquake.png">

    <!-- PWA Manifest 設定 -->
    <link rel="manifest" id="manifestPlaceholder">

    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #27ae60;
            --danger-color: #e74c3c;
            --bg-color: #f4f7f6;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            margin: 0;
            padding: 0;
            background-color: var(--bg-color);
            color: #333;
        }
        
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 1rem 1.5rem;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow-x: auto;
        }
        
        header h2 {
            margin: 0 0 8px 0;
            font-size: 1.3rem;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            white-space: nowrap;
        }

        .header-icon {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            object-fit: cover;
            flex-shrink: 0;
        }

        .admin-btn {
            position: absolute;
            top: 15px;
            right: 15px;
            background-color: #34495e;
            color: white;
            border: 1px solid #7f8c8d;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: background 0.3s;
            z-index: 10;
            white-space: nowrap;
        }
        .admin-btn:hover {
            background-color: #4e6d8c;
        }

        .header-status-container {
            text-align: center;
        }

        @media (max-width: 768px) {
            header {
                align-items: flex-start;
                padding: 1rem 100px 1rem 1rem;
            }
            header h2 {
                font-size: 1.1rem;
                justify-content: flex-start;
            }
            .header-status-container {
                text-align: left;
            }
        }

        @media (max-width: 480px) {
            header {
                padding: 0.8rem 85px 0.8rem 0.8rem;
            }
            header h2 {
                font-size: 0.95rem;
                gap: 6px;
            }
            .header-icon {
                width: 22px;
                height: 22px;
            }
            .admin-btn {
                top: 10px;
                right: 8px;
                padding: 5px 8px;
                font-size: 0.75rem;
            }
        }

        .container {
            max-width: 600px;
            margin: 20px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .view-page {
            display: none;
        }
        .view-page.active {
            display: block;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        .required-asterisk {
            color: var(--danger-color);
            font-size: 0.85em;
            vertical-align: super;
            margin-left: 2px;
        }
        input, select, textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 1rem;
        }
        button.btn-submit {
            width: 100%;
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 12px;
            font-size: 1rem;
            border-radius: 4px;
            cursor: pointer;
            line-height: 1.4;
        }
        button.btn-danger {
            background-color: var(--danger-color);
        }
        .status-badge {
            display: inline-block;
            padding: 4px 8px;
            border-radius: 4px;
            font-size: 0.85rem;
            color: white;
        }
        .offline-status {
            background-color: #f39c12;
        }
        .online-status {
            background-color: #27ae60;
        }

        .table-wrapper {
            width: 100%;
            overflow-x: auto;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 15px;
        }
        th, td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: center;
        }
        th {
            background-color: #ecf0f1;
            white-space: nowrap;
            font-size: 1rem;
        }

        @media (max-width: 768px) {
            th {
                font-size: 0.9rem;
                padding: 6px 4px;
            }
        }

        @media (max-width: 480px) {
            th {
                font-size: 0.8rem;
                padding: 6px 2px;
            }
        }

        .summary-card {
            display: flex;
            justify-content: space-around;
            margin-bottom: 20px;
            background: #eef2f5;
            padding: 15px;
            border-radius: 6px;
        }
        .summary-item {
            text-align: center;
        }
        .summary-item span {
            display: block;
            font-size: 1.5rem;
            font-weight: bold;
        }
        .back-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 8px 15px;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 15px;
        }
        .unreported-row {
            color: #95a5a6;
            background-color: #fafafa;
        }
        
        .clickable-class {
            color: #2980b9;
            text-decoration: underline;
            cursor: pointer;
            font-weight: bold;
        }
        .clickable-class:hover {
            color: #3498db;
        }

        .modal-overlay {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
            justify-content: center;
            align-items: center;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-card {
            background: white;
            width: 90%;
            max-width: 450px;
            border-radius: 8px;
            padding: 20px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            position: relative;
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 15px;
        }
        .modal-header h3 {
            margin: 0;
            color: var(--primary-color);
        }
        .modal-close-btn {
            background: none;
            border: none;
            font-size: 1.5rem;
            cursor: pointer;
            color: #7f8c8d;
        }
        .modal-body p {
            margin: 8px 0;
            line-height: 1.5;
        }
        .modal-note-box {
            background: #f8f9fa;
            border-left: 4px solid var(--accent-color);
            padding: 10px;
            margin-top: 10px;
            border-radius: 4px;
            word-break: break-all;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>

<header>
    <h2>
        <img src="icon_earthquake.png" alt="圖示" class="header-icon">
        <span>靜心高中災害避難狀況回報系統</span>
    </h2>
    <button class="admin-btn" id="adminHeaderBtn" onclick="requestAdminAccess()">進入後台</button>
    <div class="header-status-container">
        <div class="status-badge offline-status" id="connectionStatus">離線 / 本地模式運作中</div>
    </div>
</header>

<!-- 使用者端（副班長回報頁面） -->
<div id="userPage" class="container view-page active">
    <h3>各班狀況回報表單</h3>
    <form id="reportForm">
        <div class="form-group">
            <label for="className">班級名稱<span class="required-asterisk">*</span></label>
            <select id="className" required>
                <option value="" disabled selected>請選擇班級</option>
                <!-- 七年級 -->
                <option value="七年忠班">七年忠班</option>
                <option value="七年孝班">七年孝班</option>
                <option value="七年仁班">七年仁班</option>
                <option value="七年愛班">七年愛班</option>
                <option value="七年信班">七年信班</option>
                <option value="七年義班">七年義班</option>
                <!-- 八年級 -->
                <option value="八年忠班">八年忠班</option>
                <option value="八年孝班">八年孝班</option>
                <option value="八年仁班">八年仁班</option>
                <option value="八年愛班">八年愛班</option>
                <option value="八年信班">八年信班</option>
                <option value="八年義班">八年義班</option>
                <!-- 九年級 -->
                <option value="九年忠班">九年忠班</option>
                <option value="九年孝班">九年孝班</option>
                <option value="九年仁班">九年仁班</option>
                <option value="九年愛班">九年愛班</option>
                <option value="九年信班">九年信班</option>
                <option value="九年義班">九年義班</option>
                <!-- 十年級 -->
                <option value="十年誠班">十年誠班</option>
                <option value="十年愛班">十年愛班</option>
                <option value="十年熱班">十年熱班</option>
                <option value="十年智班">十年智班</option>
                <!-- 十一年級 -->
                <option value="十一年誠班">十一年誠班</option>
                <option value="十一年愛班">十一年愛班</option>
                <option value="十一年熱班">十一年熱班</option>
                <option value="十一年智班">十一年智班</option>
                <!-- 十二年級 -->
                <option value="十二年誠班">十二年誠班</option>
                <option value="十二年愛班">十二年愛班</option>
                <option value="十二年熱班">十二年熱班</option>
                <option value="十二年智班">十二年智班</option>
            </select>
        </div>
        <div class="form-group">
            <label for="reporterName">回報人（副班長）<span class="required-asterisk">*</span></label>
            <input type="text" id="reporterName" placeholder="請輸入姓名" required>
        </div>
        <div class="form-group">
            <label for="expectedCount">應到人數（請輸入扣除請假以外的人數）<span class="required-asterisk">*</span></label>
            <input type="number" id="expectedCount" min="0" value="0" required>
        </div>
        <div class="form-group">
            <label for="safeCount">平安人數<span class="required-asterisk">*</span></label>
            <input type="number" id="safeCount" min="0" value="0" required>
        </div>
        <div class="form-group">
            <label for="injuredCount">受傷人數<span class="required-asterisk">*</span></label>
            <input type="number" id="injuredCount" min="0" value="0" required>
        </div>
        <div class="form-group">
            <label for="missingCount">未到/失聯人數<span class="required-asterisk">*</span></label>
            <input type="number" id="missingCount" min="0" value="0" required>
        </div>
        <div class="form-group">
            <label for="note">特殊情況說明（例如：受傷或失聯名單細節、地點及請假名單）<span class="required-asterisk">*</span></label>
            <textarea id="note" rows="3" placeholder="若無特殊狀況請填「無」" required></textarea>
        </div>
        <button type="submit" class="btn-submit">提交回報並輸出JSON檔案（無網狀態下請將JSON檔案傳給學務主任）</button>
    </form>
</div>

<!-- 後台端（總指揮總覽頁面） -->
<div id="adminPage" class="container view-page">
    <button class="back-btn" onclick="showUserPage()">← 返回副班長回報端</button>
    <h3>後台總覽與統計</h3>
    
    <div class="summary-card">
        <div class="summary-item">
            平安總數
            <span id="totalSafe" style="color: var(--accent-color);">0</span>
        </div>
        <div class="summary-item">
            受傷總數
            <span id="totalInjured" style="color: var(--danger-color);">0</span>
        </div>
        <div class="summary-item">
            失聯總數
            <span id="totalMissing" style="color: #f39c12;">0</span>
        </div>
    </div>

    <button onclick="exportAllDataJSON()" class="btn-submit" style="margin-bottom: 10px; background-color: #3498db;">匯出成JSON檔案</button>
    <button onclick="document.getElementById('importFileInput').click()" class="btn-submit" style="margin-bottom: 10px; background-color: #27ae60;">匯入 JSON 資料檔</button>
    <input type="file" id="importFileInput" accept=".json" style="display: none;" onchange="importData(event)">
    <button onclick="clearData()" class="btn-submit btn-danger">清空所有儲存資料</button>

    <h4>全校各班回報狀態明細</h4>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>班級</th>
                    <th>回報人</th>
                    <th>平安</th>
                    <th>受傷</th>
                    <th>失聯</th>
                    <th>時間</th>
                </tr>
            </thead>
            <tbody id="reportTableBody">
                <!-- 動態加入資料 -->
            </tbody>
        </table>
    </div>
</div>

<!-- 班級詳細資料彈窗 (Modal) -->
<div class="modal-overlay" id="detailModal">
    <div class="modal-card">
        <div class="modal-header">
            <h3 id="modalTitle">班級詳細狀況</h3>
            <button class="modal-close-btn" onclick="closeModal()">&times;</button>
        </div>
        <div class="modal-body">
            <p><strong>回報人：</strong> <span id="modalReporter"></span></p>
            <p><strong>應到人數：</strong> <span id="modalExpected"></span> 人</p>
            <p><strong>平安人數：</strong> <span id="modalSafe"></span> 人</p>
            <p><strong>受傷人數：</strong> <span id="modalInjured"></span> 人</p>
            <p><strong>失聯人數：</strong> <span id="modalMissing"></span> 人</p>
            <p><strong>回報時間：</strong> <span id="modalTime"></span></p>
            <p><strong>特殊情況說明 / 狀況回報：</strong></p>
            <div class="modal-note-box" id="modalNote"></div>
        </div>
    </div>
</div>

<!-- 載入 Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<script>
    // 1. 初始化 Firebase Realtime Database
    const firebaseConfig = {
        databaseURL: "https://status-reporting-system-default-rtdb.asia-southeast1.firebasedatabase.app/"
    };
    
    let dbRef = null;
    try {
        firebase.initializeApp(firebaseConfig);
        dbRef = firebase.database().ref('disaster_reports');
        
        firebase.database().ref(".info/connected").on("value", (snap) => {
            const statusEl = document.getElementById("connectionStatus");
            if (snap.val() === true) {
                statusEl.innerText = "雲端即時連線中";
                statusEl.className = "status-badge online-status";
            } else {
                statusEl.innerText = "離線 / 本地模式運作中";
                statusEl.className = "status-badge offline-status";
            }
        });

        dbRef.on('value', (snapshot) => {
            const data = snapshot.val();
            if (data) {
                const cloudReports = Object.values(data);
                localStorage.setItem('disaster_reports', JSON.stringify(cloudReports));
                renderAdminDashboard();
            } else {
                localStorage.removeItem('disaster_reports');
                renderAdminDashboard();
            }
        });
    } catch (e) {
        console.warn("Firebase 初始化失敗，切換為純離線模式", e);
    }

    // 動態 Manifest
    const manifestData = {
        "name": "靜心高中災害避難狀況回報系統",
        "short_name": "靜心高中災害避難狀況回報系統",
        "start_url": "./",
        "display": "standalone",
        "background_color": "#2c3e50",
        "theme_color": "#2c3e50",
        "icons": [
            {
                "src": "icon_earthquake.png",
                "sizes": "192x192",
                "type": "image/png",
                "purpose": "any maskable"
            },
            {
                "src": "https://tahai-hsieh.github.io/Status-Report/icon_earthquake.png",
                "sizes": "512x512",
                "type": "image/png",
                "purpose": "any maskable"
            }
        ]
    };
    const stringManifest = JSON.stringify(manifestData);
    const blob = new Blob([stringManifest], {type: 'application/json'});
    const manifestURL = URL.createObjectURL(blob);
    document.getElementById('manifestPlaceholder').setAttribute('href', manifestURL);

    // 動態 Favicon
    window.addEventListener('DOMContentLoaded', () => {
        const img = new Image();
        img.src = 'icon_earthquake.png';
        img.onload = () => {
            const canvas = document.createElement('canvas');
            canvas.width = 64;
            canvas.height = 64;
            const ctx = canvas.getContext('2d');

            ctx.beginPath();
            ctx.arc(32, 32, 32, 0, Math.PI * 2);
            ctx.closePath();
            ctx.clip();

            ctx.drawImage(img, 0, 0, 64, 64);

            const link = document.getElementById('dynamicFavicon');
            link.href = canvas.toDataURL('image/png');
        };

        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('mode') === 'admin') {
            requestAdminAccess();
        }
    });

    const allGradeClasses = [
        "七年忠班", "七年孝班", "七年仁班", "七年愛班", "七年信班", "七年義班",
        "八年忠班", "八年孝班", "八年仁班", "八年愛班", "八年信班", "八年義班",
        "九年忠班", "九年孝班", "九年仁班", "九年愛班", "九年信班", "九年義班",
        "十年誠班", "十年愛班", "十年熱班", "十年智班",
        "十一年誠班", "十一年愛班", "十一年熱班", "十一年智班",
        "十二年誠班", "十二年愛班", "十二年熱班", "十二年智班"
    ];

    function requestAdminAccess() {
        const password = prompt("請輸入後台管理密碼：");
        if (password === "3118") {
            showAdminPage();
        } else if (password !== null) {
            alert("密碼錯誤，無法進入後台！");
            showUserPage();
        }
    }

    function showAdminPage() {
        document.getElementById('userPage').classList.remove('active');
        document.getElementById('adminPage').classList.add('active');
        document.getElementById('adminHeaderBtn').style.display = 'none';
        renderAdminDashboard();
    }

    function showUserPage() {
        document.getElementById('adminPage').classList.remove('active');
        document.getElementById('userPage').classList.add('active');
        document.getElementById('adminHeaderBtn').style.display = 'block';
        
        if (window.location.search.includes('mode=admin')) {
            const newUrl = window.location.pathname;
            window.history.replaceState({}, document.title, newUrl);
        }
    }

    function getReports() {
        const reports = localStorage.getItem('disaster_reports');
        return reports ? JSON.parse(reports) : [];
    }

    function saveReport(data) {
        const reports = getReports();
        const existingIndex = reports.findIndex(r => r.className === data.className);
        
        if (existingIndex !== -1) {
            reports[existingIndex] = data;
        } else {
            reports.push(data);
        }
        localStorage.setItem('disaster_reports', JSON.stringify(reports));

        if (dbRef) {
            dbRef.child(data.className).set(data).catch(err => {
                console.log("離線中，資料已寫入本機。");
            });
        }
    }

    // 共用觸發原生分享或檔案下載函式
    async function triggerJSONExport(dataArray, fileName) {
        const jsonText = JSON.stringify(dataArray, null, 2);
        const blob = new Blob([jsonText], { type: 'application/json' });

        if (navigator.share && navigator.canShare) {
            const file = new File([blob], fileName, { type: 'application/json' });
            if (navigator.canShare({ files: [file] })) {
                try {
                    await navigator.share({
                        title: fileName.replace('.json', ''),
                        files: [file]
                    });
                    return;
                } catch (err) {
                    console.log("使用者取消分享或傳輸中斷");
                }
            }
        }

        const dataStr = URL.createObjectURL(blob);
        const downloadAnchor = document.createElement('a');
        downloadAnchor.setAttribute("href", dataStr);
        downloadAnchor.setAttribute("download", fileName);
        document.body.appendChild(downloadAnchor);
        downloadAnchor.click();
        downloadAnchor.remove();
        URL.revokeObjectURL(dataStr);
    }

    // 副班長提交回報與輸出 JSON
    document.getElementById('reportForm').addEventListener('submit', async function(e) {
        e.preventDefault();
        
        const className = document.getElementById('className').value;
        const reports = getReports();
        const isDuplicate = reports.some(r => r.className === className);

        if (isDuplicate) {
            const confirmUpdate = confirm(`該班級（${className}）已有資料，是否要更新資料？`);
            if (!confirmUpdate) {
                return;
            }
        }
        
        const reportData = {
            id: Date.now(),
            className: className,
            reporterName: document.getElementById('reporterName').value,
            expectedCount: parseInt(document.getElementById('expectedCount').value) || 0,
            safeCount: parseInt(document.getElementById('safeCount').value) || 0,
            injuredCount: parseInt(document.getElementById('injuredCount').value) || 0,
            missingCount: parseInt(document.getElementById('missingCount').value) || 0,
            note: document.getElementById('note').value,
            timestamp: new Date().toLocaleTimeString()
        };

        saveReport(reportData);
        alert('回報已順利提交！請在接下來跳出的選單中選擇 AirDrop 傳給學務主任，或選擇「儲存到檔案」。');
        
        await triggerJSONExport([reportData], `${reportData.className}_避難回報.json`);
        this.reset();
    });

    // 後台匯出全校 JSON 檔案
    async function exportAllDataJSON() {
        const reports = getReports();
        if (reports.length === 0) {
            alert("目前尚無任何班級回報資料可供匯出！");
            return;
        }

        // 檢查是否有未完成回報的班級
        const reportedClasses = reports.map(r => r.className);
        const hasUnreported = allGradeClasses.some(cls => !reportedClasses.includes(cls));

        if (hasUnreported) {
            const proceed = confirm("尚有班級未完成回報，確定要匯出嗎？");
            if (!proceed) {
                return;
            }
        }

        // 提示輸入自訂標題
        const customTitleInput = prompt("請輸入匯出檔案的標題（若無請直接留空按下確定）：");
        if (customTitleInput === null) return; // 使用者按取消

        const customTitle = customTitleInput.trim() ? `_${customTitleInput.trim()}` : '';

        // 依據時間排序計算最前與最後回報時間
        const sortedReports = [...reports].sort((a, b) => a.id - b.id);
        const firstTime = sortedReports[0].timestamp.replace(/:/g, '-');
        const lastTime = sortedReports[sortedReports.length - 1].timestamp.replace(/:/g, '-');
        
        const now = new Date();
        const dateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(now.getDate()).padStart(2, '0')}`;
        
        const fileName = `${dateStr}_${firstTime}～${lastTime}${customTitle}_災害狀況回報表.json`;

        await triggerJSONExport(reports, fileName);
    }

    function renderAdminDashboard() {
        const reports = getReports();
        const tbody = document.getElementById('reportTableBody');
        tbody.innerHTML = '';

        const reportMap = {};
        reports.forEach(r => {
            reportMap[r.className] = r;
        });

        let totalSafe = 0;
        let totalInjured = 0;
        let totalMissing = 0;

        allGradeClasses.forEach(className => {
            const tr = document.createElement('tr');
            
            if (reportMap[className]) {
                const report = reportMap[className];
                totalSafe += report.safeCount;
                totalInjured += report.injuredCount;
                totalMissing += report.missingCount;

                tr.innerHTML = `
                    <td>
                        <span class="clickable-class" onclick="openModal('${escapeHtml(report.className)}')">
                            ${escapeHtml(report.className)}
                        </span>
                    </td>
                    <td>${escapeHtml(report.reporterName)}</td>
                    <td>${report.safeCount}</td>
                    <td>${report.injuredCount}</td>
                    <td>${report.missingCount}</td>
                    <td>${report.timestamp}</td>
                `;
            } else {
                tr.classList.add('unreported-row');
                tr.innerHTML = `
                    <td>${className}</td>
                    <td colspan="5"><em>未回報</em></td>
                `;
            }
            tbody.appendChild(tr);
        });

        document.getElementById('totalSafe').innerText = totalSafe;
        document.getElementById('totalInjured').innerText = totalInjured;
        document.getElementById('totalMissing').innerText = totalMissing;
    }

    function openModal(className) {
        const reports = getReports();
        const report = reports.find(r => r.className === className);
        if (!report) return;

        document.getElementById('modalTitle').innerText = `${report.className} 詳細狀況`;
        document.getElementById('modalReporter').innerText = report.reporterName || '無';
        document.getElementById('modalExpected').innerText = report.expectedCount !== undefined ? report.expectedCount : '未填寫';
        document.getElementById('modalSafe').innerText = report.safeCount;
        document.getElementById('modalInjured').innerText = report.injuredCount;
        document.getElementById('modalMissing').innerText = report.missingCount;
        document.getElementById('modalTime').innerText = report.timestamp;
        document.getElementById('modalNote').innerText = report.note || '無特殊說明';

        document.getElementById('detailModal').classList.add('active');
    }

    function closeModal() {
        document.getElementById('detailModal').classList.remove('active');
    }

    window.addEventListener('click', (e) => {
        const modal = document.getElementById('detailModal');
        if (e.target === modal) {
            closeModal();
        }
    });

    function escapeHtml(text) {
        return text.replace(/[&<>"']/g, function(m) {
            return {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            }[m];
        });
    }

    function importData(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.onload = function(e) {
            try {
                let importedReports = JSON.parse(e.target.result);
                if (!Array.isArray(importedReports)) {
                    importedReports = [importedReports];
                }

                importedReports.forEach(newReport => {
                    if (newReport && newReport.className) {
                        saveReport(newReport);
                    }
                });

                renderAdminDashboard();
                alert(`成功匯入/更新資料！`);
            } catch (err) {
                alert("讀取檔案失敗，請確認檔案是否為正確的 JSON 備份檔。");
            }
            event.target.value = '';
        };
        reader.readAsText(file);
    }

    // 清除本地 LocalStorage 以及 Firebase 雲端資料庫
    function clearData() {
        const password = prompt("清除資料屬於高風險操作，請輸入管理密碼確認：");
        if (password === "3118") {
            if (confirm("密碼正確，確定要清空所有已回報的歷史資料（含雲端）嗎？此操作無法復原！")) {
                localStorage.removeItem('disaster_reports');
                
                if (dbRef) {
                    dbRef.remove().then(() => {
                        console.log("Firebase 雲端資料庫已成功清空");
                    }).catch(err => {
                        console.error("Firebase 清空失敗：", err);
                    });
                }
                
                renderAdminDashboard();
                alert("已成功清空所有本地及雲端資料！");
            }
        } else if (password !== null) {
            alert("密碼錯誤，無法清除資料！");
        }
    }
</script>
